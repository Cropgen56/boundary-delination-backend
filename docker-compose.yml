services:
  api:
    build: .
    image: boundary-delineation-backend:latest
    ports:
      - "8080:8080"
    environment:
      S3_BUCKET: ${S3_BUCKET:-}
      S3_PREFIX: ${S3_PREFIX:-boundary-results}
      AWS_REGION: ${AWS_REGION:-}
      RESULT_CACHE_VERSION: ${RESULT_CACHE_VERSION:-v1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    restart: unless-stopped
